[package]
name = "vitrine"
version = "0.1.2"
edition = "2024"
description = "Rust core for the Citron Neo emulator: pipeline cache, IPC services, and the pieces where safe code costs nothing at runtime."
license = "GPL-3.0-or-later"
repository = "https://github.com/Sophia-Thickums/vitrine"
readme = "README.md"
keywords = ["aarch64", "jit", "emulator", "vulkan", "translator"]
categories = ["emulators", "development-tools"]
exclude = ["/.github", "/cpp/citron/shim"]
# A Rust staticlib is the shipping artefact; the crate is not intended for crates.io, where a
# cdylib/staticlib pair with a C header is not the expected shape.

[lib]
# cdylib so C++ links it; staticlib for a fully static binary; rlib for tests and crates.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
thiserror = "2"
# mmap/mprotect for the executable mapping the compiled blocks run from; std has no equivalent.
libc = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1

[dev-dependencies]
# Vulkan bindings for the pipeline-cost measurement; the crate itself has no GPU dependency.
ash = { version = "0.38", default-features = false, features = ["loaded", "debug"] }
